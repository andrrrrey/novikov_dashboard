# Скопировать в /etc/nginx/sites-available/club, затем symlink в sites-enabled.
# Сертификат — Let's Encrypt (sudo certbot --nginx -d club-app.ru). Если certbot уже
# правил конфиг на сервере — сверить с ним (sudo nginx -T), а не затирать вслепую.

# HTTP → только редирект на HTTPS (пароли и cookie по открытому каналу не ходят).
server {
    listen 80;
    server_name club-app.ru 217.12.37.176;
    return 301 https://club-app.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name club-app.ru;

    ssl_certificate     /etc/letsencrypt/live/club-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club-app.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Браузер год ходит только по HTTPS; запрет встраивания в чужие фреймы и т.п.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /club { return 301 /club/; }

    location /club/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /club/ {
        alias /var/www/novikov_dashboard/club-frontend/dist/;
        try_files $uri $uri/ /club/index.html;
    }
}
